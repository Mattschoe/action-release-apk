on:
  push:
    branches:
      - main

permissions: 
  contents: write
  issues: write
  pull-requests: write

name: release-please
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: simple

      - name: Move major tag (v1)
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          MAJOR: ${{ steps.release.outputs.major }}
          TAG:   ${{ steps.release.outputs.tag_name }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/v${MAJOR}" \
            -f sha="$(gh api repos/${{ github.repository }}/git/refs/tags/${TAG} --jq .object.sha)" \
            -F force=true \
            || gh api -X POST "repos/${{ github.repository }}/git/refs" \
                 -f ref="refs/tags/v${MAJOR}" \
                 -f sha="$(gh api repos/${{ github.repository }}/git/refs/tags/${TAG} --jq .object.sha)"
